schema_version = 1

# One bounded core candidate smoke per canonical target.
#
# `version` (bare argv) is the identity check: it proves the exact candidate
# executes and identifies itself as `stegoeggo X.Y.Z`. Product semantic
# validation (help, protect/inspect/verify, GLIBC ceiling) is separate in
# the StegoEggo-owned consumer validator
# (`scripts/smoke-release-binary.py`), not in this core smoke.

[targets."aarch64-apple-darwin"]
[targets."aarch64-apple-darwin".smoke]
selector = { kind = "direct" }
argv = ["version"]
timeout_ms = 10000
stdout_limit = 8192
stderr_limit = 8192

[targets."aarch64-unknown-linux-gnu"]
[targets."aarch64-unknown-linux-gnu".smoke]
selector = { kind = "direct" }
argv = ["version"]
timeout_ms = 10000
stdout_limit = 8192
stderr_limit = 8192

[targets."x86_64-apple-darwin"]
[targets."x86_64-apple-darwin".smoke]
selector = { kind = "direct" }
argv = ["version"]
timeout_ms = 10000
