name: Fuzz

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target to run"
        required: true
        type: choice
        options:
          - pipeline_bytes
          - jpeg_parser
          - payload_v3_parser
          - tiled_round_trip
          - png_metadata
          - webp_riff_parser
          - xmp_extract
          - metadata_merge
          - detached_manifest_parse
          - detached_manifest_verify
          - provenance_canonicalize
          - verification_report
      seconds:
        description: "Maximum run duration"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Validate inputs
        run: |
          TARGET="${{ inputs.target }}"
          SECONDS="${{ inputs.seconds }}"
          if ! [[ "$TARGET" =~ ^[a-z_]+$ ]]; then
            echo "::error::Invalid target name"
            exit 1
          fi
          if ! [[ "$SECONDS" =~ ^[0-9]+$ ]] || [ "$SECONDS" -lt 1 ] || [ "$SECONDS" -gt 3600 ]; then
            echo "::error::Seconds must be between 1 and 3600"
            exit 1
          fi

      - name: Run fuzz (${{ inputs.target }})
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo fuzz run "${{ inputs.target }}" -- \
            -max_total_time="${{ inputs.seconds }}" \
            -max_len=4096 \
            -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ inputs.target }}
          path: fuzz/corpus/${{ inputs.target }}/
          retention-days: 30
