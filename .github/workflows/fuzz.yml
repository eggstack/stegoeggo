name: Fuzz

# Single-target manual dispatch plus a bounded weekly smoke rotation over all
# targets. The smoke job runs a rotating 3-target subset (week-of-year based,
# full rotation every four weeks) for 120s each and uploads crash artifacts.
# Scheduled runs are informational signal only: failure never blocks merges
# or triggers a release. No fuzzing runs on pull requests.
#
# Local equivalent (requires the pinned nightly + cargo-fuzz):
#   RUSTUP_TOOLCHAIN=nightly-2026-09-07 CARGO_PROFILE_RELEASE_LTO=false \
#     cargo fuzz run <target> -- -max_total_time=60
#
# A manual dispatch with `smoke=true` exercises the same rotating smoke path as
# the schedule; its required `target` value is ignored. The dispatch `target`
# options below are the canonical target list verified
# by `scripts/check_fuzz_sync.sh`. The smoke rotation derives its list at
# runtime from `cargo fuzz list`, so it cannot drift from `fuzz/Cargo.toml`.

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target to run"
        required: true
        type: choice
        options:
          - pipeline_bytes
          - jpeg_parser
          - payload_v3_parser
          - tiled_round_trip
          - png_metadata
          - webp_riff_parser
          - xmp_extract
          - metadata_merge
          - detached_manifest_parse
          - detached_manifest_verify
          - provenance_canonicalize
          - verification_report
      seconds:
        description: "Maximum run duration"
        required: false
        default: "60"
      smoke:
        description: "Run the scheduled rotating smoke path"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ inputs.target }})
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == false
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-07
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-07
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify fuzz toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo fuzz --version
          echo "CARGO_PROFILE_RELEASE_LTO=${CARGO_PROFILE_RELEASE_LTO}"

      - name: Validate inputs
        run: |
          TARGET="${{ inputs.target }}"
          SECONDS="${{ inputs.seconds }}"
          if ! [[ "$TARGET" =~ ^[a-z_]+$ ]]; then
            echo "::error::Invalid target name"
            exit 1
          fi
          if ! [[ "$SECONDS" =~ ^[0-9]+$ ]] || [ "$SECONDS" -lt 1 ] || [ "$SECONDS" -gt 3600 ]; then
            echo "::error::Seconds must be between 1 and 3600"
            exit 1
          fi

      - name: Run fuzz (${{ inputs.target }})
        run: |
          cargo fuzz run "${{ inputs.target }}" -- \
            -max_total_time="${{ inputs.seconds }}" \
            -max_len=4096 \
            -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ inputs.target }}
          path: fuzz/corpus/${{ inputs.target }}/
          retention-days: 30

  smoke:
    name: Fuzz smoke (rotating subset)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.smoke == true)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-07
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-07
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify fuzz toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo fuzz --version
          echo "CARGO_PROFILE_RELEASE_LTO=${CARGO_PROFILE_RELEASE_LTO}"

      - name: Select rotating smoke subset
        id: select
        run: |
          WEEK="$(date +%V)"
          mapfile -t ALL < <(cargo fuzz list | sort)
          COUNT="${#ALL[@]}"
          SIZE=3
          START="$(( (10#$WEEK * SIZE) % COUNT ))"
          TARGETS=()
          for (( i=0; i<SIZE; i++ )); do
            TARGETS+=("${ALL[$(( (START + i) % COUNT ))]}")
          done
          echo "week=$WEEK count=$COUNT start=$START targets=${TARGETS[*]}"
          echo "targets=${TARGETS[*]}" >> "$GITHUB_OUTPUT"

      - name: Run fuzz smoke (120s per target)
        run: |
          for TARGET in ${{ steps.select.outputs.targets }}; do
            echo "=== fuzz smoke: $TARGET ==="
            cargo fuzz run "$TARGET" -- \
              -max_total_time=120 \
              -max_len=4096 \
              -timeout=10
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30
