# Lightweight Python binding compatibility check.
#
# Runs the binding test suite on a single Linux x86_64 / Python 3.11 job to
# catch root API drift early. This is a binding-specific signal and is
# independent of the standard Rust Check gate in `ci.yml`; it does not add
# Python tooling to `./scripts/check.sh` and never publishes wheels or
# sdists. Cross-platform wheel qualification remains the responsibility of
# the manually-dispatched `.github/workflows/release-python.yml`.
#
# The job deliberately builds a real wheel and installs that wheel instead of
# running `maturin develop`. `maturin develop` requires an active virtualenv
# or conda environment, and `actions/setup-python` does not provide one, so
# the develop path failed before any test could run. The wheel path is
# self-contained, validates the same artifact shape users install, and keeps
# this job much lighter than the five-platform release workflow.

name: python-binding

on:
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "src/**"
      - "stegoeggo-stego/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bindings/python/tests/fixtures/**"
      - ".github/workflows/python-binding.yml"
  pull_request:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "src/**"
      - "stegoeggo-stego/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bindings/python/tests/fixtures/**"
      - ".github/workflows/python-binding.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-binding-check:
    name: python-binding-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (matches binding MSRV)
        uses: dtolnay/rust-toolchain@1.89

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        run: python -m pip install -U pip "maturin>=1.5,<2.0" pytest

      # `extension-module` is off here so the crate's own `#[cfg(test)]` unit
      # tests link against libpython; the wheel build below uses it via the
      # default feature set.
      - name: Run the crate unit tests
        working-directory: bindings/python
        run: cargo test --no-default-features

      - name: Build the binding wheel
        working-directory: bindings/python
        run: maturin build --release --out dist-ci

      - name: Install the built wheel
        run: python -m pip install --force-reinstall bindings/python/dist-ci/stegoeggo-*.whl

      - name: Run the binding test suite
        working-directory: bindings/python
        run: python -m pytest -v
