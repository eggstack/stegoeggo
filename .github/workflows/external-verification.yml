name: External Verification

# Manual dispatch plus a low-frequency monthly schedule. Scheduled runs are
# informational signal only: failure never blocks merges or triggers a
# release. Branch protection requires only the `Check` job in `ci.yml`.
#
# Local equivalent (requires exiftool, xmllint, imagemagick, libvips):
#   scripts/verify_metadata_conformance.sh --strict

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: External Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl libxml2-utils imagemagick libvips-tools

      - name: Run external integration tests
        run: cargo test --test external_tools -- --ignored

      - name: Build conformance harness
        run: cargo build --release --bin stegoeggo-conformance

      - name: Run conformance checks
        run: |
          ./target/release/stegoeggo-conformance \
            --fixtures tests/fixtures/conformance \
            --manifest tests/fixtures/conformance/manifest.toml \
            --strict
