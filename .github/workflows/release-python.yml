# Build Python wheels for stegoeggo.
#
# This workflow is manually dispatched (`workflow_dispatch`); it never runs on
# push or pull_request and it never publishes to PyPI. See RELEASING.md for the
# manual registry publication policy.
#
# Wheels are produced for the project's documented support matrix and
# uploaded as GitHub Actions artifacts for maintainer inspection:
#
#   - manylinux x86_64 (musllinux variant skipped — manylinux_2_28 baseline
#     matches the documented glibc floor of the Rust CLI release targets).
#   - manylinux aarch64
#   - macOS x86_64
#   - macOS arm64
#   - Windows x86_64
#
# Every wheel is produced on a runner that matches the wheel's native
# architecture and the per-platform smoke installs the wheel on the same
# native arch. The Linux cibuildwheel job installs Rust 1.89 inside the
# build container via `before-all` (rather than only on the outer GitHub
# runner) and pins the manylinux compatibility tag explicitly. A separate
# sdist build runs once on a single Linux x86_64 job; the resulting sdist
# is then installed by direct `pip install <tarball>` in a clean venv that
# does not have the source checkout on `sys.path`.

name: release-python

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: >
          Source ref (tag, branch, or SHA) to build from. Use the StegoEggo
          release tag or a specific commit SHA.
        required: true
        type: string

concurrency:
  group: release-python-${{ github.event.inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: build ${{ matrix.id }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-24.04
            cibw_archs: x86_64
            cibw_build: cp311-*
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
            cibw_build: cp311-*
          - id: macos-x86_64
            os: macos-15-intel
            cibw_archs: x86_64
            cibw_build: cp311-*
          - id: macos-arm64
            os: macos-14
            cibw_archs: arm64
            cibw_build: cp311-*
          - id: windows-x86_64
            os: windows-2022
            cibw_archs: AMD64
            cibw_build: cp311-*

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Install Rust toolchain on outer runner
        uses: dtolnay/rust-toolchain@1.89

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        env:
          CIBW_BEFORE_ALL: 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.89 --profile minimal --target $(uname -m)-unknown-linux-gnu && echo "source $HOME/.cargo/env" >> $GITHUB_ENV'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        run: |
          python -m cibuildwheel ./bindings/python \
            --output-dir ./dist \
            --archs "${{ matrix.cibw_archs }}" \
            --build "${{ matrix.cibw_build }}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.id }}
          path: ./dist/stegoeggo-*-${{ matrix.cibw_archs }}*.whl
          if-no-files-found: error

  build_sdist:
    name: build sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install maturin==1.5.0
          cd bindings/python
          python -m maturin sdist -o ../../dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: ./dist/stegoeggo-*.tar.gz
          if-no-files-found: error

  sdist_install_smoke:
    name: sdist direct pip install smoke
    needs: build_sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sdist in a clean venv outside the checkout
        run: |
          set -euo pipefail
          python -m pip install -U pip
          SDIST=$(ls stegoeggo-*.tar.gz | head -n1)
          echo "Using sdist: $SDIST"
          python -m venv /tmp/stegoeggo-sdist-venv
          /tmp/stegoeggo-sdist-venv/bin/python -m pip install --no-cache-dir "$SDIST" pytest
          /tmp/stegoeggo-sdist-venv/bin/python -c "import stegoeggo; print('version:', stegoeggo.__version__)"
          /tmp/stegoeggo-sdist-venv/bin/python -c "
          import stegoeggo
          notice = stegoeggo.RightsNotice().with_copyright_holder('sdist smoke')
          request = stegoeggo.ProtectionRequest.metadata_only(
              notice, stegoeggo.RightsPolicy.ProhibitedAiMlTraining,
          ).with_seed(42).with_timestamp_override('2026-01-01T00:00:00Z')
          png = bytes.fromhex('89504e470d0a1a0a0000000d49484452000000040000000408060000003e15c4890000001e49444154789c63fcffffff3f0324c00409ff0518110000000049454e44ae426082')
          out = stegoeggo.protect(png, request)
          rep = stegoeggo.verify(out)
          assert rep.rights_found, rep.to_json()
          assert rep.copyright_holder == 'sdist smoke', rep.to_json()
          print('sdist direct-pip-install smoke ok')
          "

  verify_smoke:
    name: smoke ${{ matrix.id }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-24.04
            cibw_archs: x86_64
            python: "3.11"
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
            python: "3.11"
          - id: macos-x86_64
            os: macos-15-intel
            cibw_archs: x86_64
            python: "3.11"
          - id: macos-arm64
            os: macos-14
            cibw_archs: arm64
            python: "3.11"
          - id: windows-x86_64
            os: windows-2022
            cibw_archs: AMD64
            python: "3.11"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ matrix.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install wheel and smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          WHEEL=$(ls stegoeggo-*-${{ matrix.cibw_archs }}-*.whl 2>/dev/null || ls stegoeggo-*-cp311-abi3-*.whl | head -n1)
          echo "Using wheel: $WHEEL"
          python -m pip install "$WHEEL" pytest
          python -c "import stegoeggo; print('version:', stegoeggo.__version__)"
          python -c "import stegoeggo; print('detect:', stegoeggo.detect_format(b'\\x89PNG\\r\\n'))"
          python -c "
          import stegoeggo
          notice = stegoeggo.RightsNotice().with_copyright_holder('release-python smoke')
          request = stegoeggo.ProtectionRequest.metadata_only(
              notice, stegoeggo.RightsPolicy.ProhibitedAiMlTraining,
          ).with_seed(42).with_timestamp_override('2026-01-01T00:00:00Z')
          png = bytes.fromhex('89504e470d0a1a0a0000000d49484452000000040000000408060000003e15c4890000001e49444154789c63fcffffff3f0324c00409ff0518110000000049454e44ae426082')
          out = stegoeggo.protect(png, request)
          rep = stegoeggo.verify(out)
          assert rep.rights_found, rep.to_json()
          assert rep.copyright_holder == 'release-python smoke', rep.to_json()
          print('smoke ok')
          "
