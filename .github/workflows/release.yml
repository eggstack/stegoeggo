name: Validate Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Verify tag matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          CLI_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' stegoeggo-cli/Cargo.toml)
          echo "Tag:        $TAG_VERSION"
          echo "Package:    $PKG_VERSION"
          echo "CLI:        $CLI_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Tag does not match Cargo.toml versions"
            exit 1
          fi

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl libxml2-utils imagemagick libvips-tools

      - name: Log tool versions
        run: |
          {
            echo "exiftool $(exiftool -ver)"
            echo "xmllint $(xmllint --version 2>&1 | head -1)"
            echo "imagemagick $(convert --version 2>&1 | head -1)"
            echo "libvips $(vips --version 2>&1 | head -1)"
            echo "rustc $(rustc --version)"
            echo "cargo $(cargo --version)"
          } > tool-versions.txt

      - name: Run authoritative validation
        run: scripts/validate-release.sh --phase all --expected-sha="$(git rev-parse HEAD)"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

      - name: Upload tool versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tool-versions
          path: tool-versions.txt
