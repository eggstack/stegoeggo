[workspace]

[package]
name = "stegoeggo-python"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
description = "Python bindings for the stegoeggo rights-reservation and steganography library"
authors = ["David Bowman <dbowman91@proton.me>"]
license = "MIT"
repository = "https://github.com/eggstack/stegoeggo"
publish = false

[lib]
name = "_stegoeggo_native"
crate-type = ["cdylib"]

[dependencies]
stegoeggo = { path = "../..", version = "=0.4.2", default-features = false }
pyo3 = { version = "0.27", features = ["abi3-py311", "extension-module"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
opt-level = "s"
strip = "symbols"

[profile.dev]
panic = "unwind"
