[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "stegoeggo"
version = "0.4.2"
description = "Python bindings for the stegoeggo rights-reservation and steganography library"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Bowman", email = "dbowman91@proton.me" }]
keywords = ["image", "steganography", "legal-notice", "ai-safety", "rights-metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/abi3-py311"]
# Paths are relative to the pyproject.toml location inside the source tree.
# In a sdist build, the pyproject.toml is hoisted to the package root, so the
# python-source path is rewritten in the sdist hook below.
python-source = "python"
module-name = "stegoeggo._native"
include = ["_native.pyi", "py.typed"]
