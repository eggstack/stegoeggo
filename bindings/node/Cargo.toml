[workspace]

[package]
name = "stegoeggo-node"
version = "0.4.3"
edition = "2021"
rust-version = "1.89"
description = "Node.js bindings for the stegoeggo rights-reservation and steganography library"
authors = ["David Bowman <dbowman91@proton.me>"]
license = "MIT"
repository = "https://github.com/eggstack/stegoeggo"
publish = false

[lib]
name = "stegoeggo"
crate-type = ["cdylib"]

[dependencies]
stegoeggo = { path = "../..", version = "=0.4.3", default-features = false }
napi = { version = "3.13.0", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3.6.9"

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
opt-level = "s"
strip = "symbols"

[profile.dev]
panic = "unwind"
