[workspace]
resolver = "2"
members = [".", "stegoeggo-stego", "stegoeggo-cli", "fuzz"]

[package]
name = "stegoeggo"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
description = "Rights-reservation metadata and AI-training restriction notices for images, with optional steganographic markers"
authors = ["David Bowman <dbowman91@proton.me>"]
license = "MIT"
repository = "https://github.com/eggstack/stegoeggo"
homepage = "https://github.com/eggstack/stegoeggo"
documentation = "https://docs.rs/stegoeggo"
readme = "README.md"
keywords = ["image", "steganography", "legal-notice", "ai-safety", "rights-metadata"]
categories = ["graphics", "multimedia::images"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "SUPPORT.md",
    "STABILITY.md",
    "DEPRECATIONS.md",
    "RELEASING.md",
    "docs/**/*.md",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "benches/**/*.rs",
]

[features]
default = []
async = ["tokio"]
signatures = ["ed25519-dalek"]
test-seeds = []
fuzz = []
detached-manifest = []
iscc = ["dep:iscc-lib"]
conformance = ["dep:toml", "unicode-normalization"]
parallel = ["dep:rayon"]

[dependencies]
stegoeggo-stego = { path = "stegoeggo-stego", version = "=0.4.0", features = ["application-support"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
jpeg-encoder = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
digest = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
crc32fast = "1.4"
iscc-lib = { version = "0.4", optional = true }
getrandom = "0.2"
rayon = { version = "1.10", optional = true }
toml = { version = "1", optional = true }
subtle = "2"
ed25519-dalek = { version = "3", features = ["zeroize"], optional = true }
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
quick-xml = { version = "0.41.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["macros"] }
tempfile = "3"

[[test]]
name = "async_integration"
path = "tests/async_integration.rs"
required-features = ["async"]

[[test]]
name = "conformance_harness_tests"
path = "tests/conformance_harness_tests.rs"
required-features = ["conformance"]

[[bench]]
name = "bench"
harness = false

[[example]]
name = "protect_and_verify"
path = "examples/protect_and_verify.rs"

[[example]]
name = "verify_saved"
path = "examples/verify_saved.rs"

[[bin]]
name = "stegoeggo-conformance"
path = "src/bin/stegoeggo-conformance.rs"
required-features = ["conformance"]

[[example]]
name = "legal_metadata"
path = "examples/legal_metadata.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
opt-level = "s"
